name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: um-presente-para-voce
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: um-presente-para-voce/.nvmrc
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn validate
      - run: yarn build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: um-presente-para-voce/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
