name: Verificar projeto

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: um-presente-para-voce
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: um-presente-para-voce/.nvmrc
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn validate
      - run: yarn build
